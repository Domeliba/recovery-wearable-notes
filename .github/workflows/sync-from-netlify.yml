name: Sync site from Netlify

on:
  push:
    paths:
      - ".github/workflows/sync-from-netlify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current production site
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://recovery-wearable-notes.netlify.app"
          mkdir -p it assets

          curl -fsSL "$BASE/" -o index.html
          curl -fsSL "$BASE/it/" -o it/index.html
          curl -fsSL "$BASE/assets/config.js" -o assets/config.js
          curl -fsSL "$BASE/assets/style.css" -o assets/style.css
          curl -fsSL "$BASE/assets/whoop-referral-qr.png" -o assets/whoop-referral-qr.png
          curl -fsSL "$BASE/robots.txt" -o robots.txt
          curl -fsSL "$BASE/sitemap.xml" -o sitemap.xml

          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()

          /assets/*
            Cache-Control: public, max-age=86400
          EOF

          cat > README.md <<'EOF'
          # Recovery Wearable Notes

          Independent static site about screenless wearables and the WHOOP referral program.

          Production: https://recovery-wearable-notes.netlify.app/

          The site includes a transparent referral disclosure. WHOOP referral code: FC2E68B1.

          This repository is intended to be connected to Netlify so future source changes can deploy automatically.
          EOF

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html it/index.html assets/config.js assets/style.css assets/whoop-referral-qr.png robots.txt sitemap.xml _headers README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync production site from Netlify"
          git push
