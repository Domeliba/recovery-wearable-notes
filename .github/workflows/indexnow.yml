name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "it/index.html"
      - "whoop-trial-to-peak/**"
      - "it/prova-whoop-peak/**"
      - "whoop-night-shifts/**"
      - "it/whoop-turni-notturni/**"
      - "sitemap.xml"
      - "robots.txt"
      - "assets/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the published content release before notifying search engines
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://recovery-wearable-notes.netlify.app"
          KEY="a4d1c9f43b8e4a83a567cb0192e5d7f1"
          RELEASE="2026-11-05-referral-content"
          for i in {1..12}; do
            READY=true
            if ! KEY_CONTENT=$(curl -fsS --max-time 15 "$BASE/$KEY.txt") || [[ "$KEY_CONTENT" != "$KEY" ]]; then
              READY=false
            fi
            for PAGE_PATH in / /it/ /whoop-trial-to-peak/ /it/prova-whoop-peak/ /whoop-night-shifts/ /it/whoop-turni-notturni/; do
              if ! PAGE_HTML=$(curl -fsS --max-time 15 "$BASE$PAGE_PATH"); then
                READY=false
                break
              fi
              if [[ "$PAGE_HTML" != *"content-version"*"$RELEASE"* ]]; then
                READY=false
                break
              fi
            done
            if [ "$READY" = true ]; then
              echo "All six pages contain the expected release."
              exit 0
            fi
            echo "Waiting for Netlify to publish the expected content release..."
            sleep 10
          done
          echo "::error::Production content does not match this release. No IndexNow request sent."
          exit 1

      - name: Notify IndexNow about the canonical pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://recovery-wearable-notes.netlify.app"
          KEY="a4d1c9f43b8e4a83a567cb0192e5d7f1"
          for PATHNAME in / /it/ /whoop-trial-to-peak/ /it/prova-whoop-peak/ /whoop-night-shifts/ /it/whoop-turni-notturni/; do
            URL="$BASE$PATHNAME"
            HTTP_STATUS=$(curl -sS --max-time 30 --get "https://api.indexnow.org/indexnow" \
              --data-urlencode "url=$URL" --data-urlencode "key=$KEY" \
              -o /dev/null -w "%{http_code}")
            case "$HTTP_STATUS" in
              200|202) echo "IndexNow received $URL (HTTP $HTTP_STATUS); indexing is not guaranteed." ;;
              *) echo "::error::IndexNow rejected $URL (HTTP $HTTP_STATUS)"; exit 1 ;;
            esac
          done

